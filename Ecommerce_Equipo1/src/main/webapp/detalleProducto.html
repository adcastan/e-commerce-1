<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro - Hojas Sueltas</title>
    <script>
        (function(){
            var p = window.location.pathname.split('/').filter(Boolean);
            var ctx = (p.length > 1 && !p[0].includes('.')) ? '/' + p[0] + '/' : '/';
            document.write('<base href="' + ctx + '">');
        })();
    </script>
    <link rel="stylesheet" href="static/css/cliente.css">
</head>
<body>
<header class="encabezado-principal">
    <div class="contenedor">
        <a href="index.html" class="marca">
            <span class="nombre">Hojas Sueltas</span>
            <span class="lema">cada libro, una historia</span>
        </a>
        <form class="buscador form-buscador">
            <input type="search" name="q" placeholder="busca por t&iacute;tulo, autor o ISBN" aria-label="buscar">
        </form>
        <nav class="acciones-encabezado"></nav>
    </div>
</header>

<main class="contenedor seccion">
    <a href="index.html" class="boton secundario" style="margin-bottom:1rem;">&larr; volver al cat&aacute;logo</a>
    <div id="contenido-detalle">
        <div class="cargando">Cargando...</div>
    </div>

    <section style="margin-top:3rem;">
        <h2>Rese&ntilde;as</h2>
        <div id="resenas" class="lista-resenas"></div>
    </section>
</main>

<footer class="pie">
    <div class="contenedor">
        <p>Hojas Sueltas &middot; Librer&iacute;a en l&iacute;nea</p>
    </div>
</footer>

<script src="static/js/api.js"></script>
<script src="static/js/carrito.js"></script>
<script src="static/js/layout.js"></script>
<script>
const idLibro = new URLSearchParams(window.location.search).get('id');
let libroActual = null;

async function cargar() {
    if (!idLibro) {
        document.getElementById('contenido-detalle').innerHTML = '<p class="estado-vacio">libro no especificado</p>';
        return;
    }
    try {
        libroActual = await llamarApi('GET', '/productos/' + idLibro);
        renderizarDetalle();
        cargarResenas();
    } catch (e) {
        document.getElementById('contenido-detalle').innerHTML = '<p class="estado-vacio">no se pudo cargar el libro</p>';
    }
}

function estrellasHtml(promedio) {
    const enteras = Math.floor(promedio);
    const media = promedio - enteras >= 0.5;
    let s = '';
    for (let i = 0; i < enteras; i++) s += '\u2605';
    if (media) s += '\u00bd';
    while (s.replace(/\u00bd/g, '').length < 5) s += '\u2606';
    return s;
}

function renderizarDetalle() {
    const l = libroActual;
    const cont = document.getElementById('contenido-detalle');
    const promedio = l.calificacionPromedio || 0;
    const cantResenas = l.cantidadResenias || 0;
    cont.innerHTML = `
        <article class="detalle-libro">
            <div class="portada">
                ${l.imagenUrl ? `<img src="${escaparHtml(l.imagenUrl)}" alt="${escaparHtml(l.titulo)}">` : '<div style="background:var(--crema);height:400px"></div>'}
            </div>
            <div>
                <h1>${escaparHtml(l.titulo)}</h1>
                <p class="autor">por ${escaparHtml(l.autor)}</p>
                ${cantResenas > 0 ? `
                    <div class="calificacion-promedio">
                        <span class="estrellas">${estrellasHtml(promedio)}</span>
                        <span>${promedio.toFixed(1)} de 5 (${cantResenas} ${cantResenas === 1 ? 'rese\u00f1a' : 'rese\u00f1as'})</span>
                    </div>
                ` : '<p style="color:var(--gris);font-size:0.9rem;">a\u00fan no tiene rese\u00f1as</p>'}
                <p class="precio-grande">${formatearMoneda(l.precio)}</p>
                ${l.stock > 0 ? `
                    <button id="btn-agregar" class="boton principal">Agregar al carrito</button>
                    <p style="font-size:0.85rem;color:var(--gris);margin-top:0.5rem;">${l.stock} en existencia</p>
                ` : '<p style="color:var(--rojo)"><strong>Agotado por el momento</strong></p>'}
                <div class="descripcion">
                    <h3>Descripci&oacute;n</h3>
                    <p>${escaparHtml(l.descripcion || 'sin descripci\u00f3n disponible')}</p>
                </div>
                <dl class="meta">
                    <dt>ISBN</dt><dd>${escaparHtml(l.isbn)}</dd>
                    <dt>G&eacute;nero</dt><dd>${escaparHtml(l.nombreGenero || '\u2014')}</dd>
                    <dt>Editorial</dt><dd>${escaparHtml(l.editorial || '\u2014')}</dd>
                    <dt>A&ntilde;o</dt><dd>${escaparHtml(l.anioPublicacion || '\u2014')}</dd>
                </dl>
            </div>
        </article>
    `;
    const btn = document.getElementById('btn-agregar');
    if (btn) btn.addEventListener('click', () => {
        Carrito.agregar(l, 1);
        notificar('libro agregado al carrito');
    });
}

async function cargarResenas() {
    try {
        const resenas = await llamarApi('GET', '/resenas/producto/' + idLibro);
        const cont = document.getElementById('resenas');
        if (!resenas || resenas.length === 0) {
            cont.innerHTML = '<p class="estado-vacio">a\u00fan no hay rese\u00f1as para este libro</p>';
            return;
        }
        cont.innerHTML = resenas.map(r => `
            <div class="resena">
                <div class="meta-resena">
                    <strong>${escaparHtml(r.nombreCliente)}</strong>
                    <span>${formatearFecha(r.fechaHora)}</span>
                </div>
                <div class="estrellas">${'\u2605'.repeat(r.calificacion)}${'\u2606'.repeat(5 - r.calificacion)}</div>
                <p>${escaparHtml(r.comentario || '')}</p>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('resenas').innerHTML = '<p class="estado-vacio">no se pudieron cargar las rese\u00f1as</p>';
    }
}

cargar();
</script>
</body>
</html>
