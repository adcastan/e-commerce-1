<%@page contentType="text/html" pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Iniciar Sesión</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Felipa&family=Lugrasimo&family=Quintessential&display=swap" rel="stylesheet">
        
        <style>
            :root {
                --primario: #388659;
                --secundario: #1C3738;
                --acento: #A79C70;
                --error: #C1292E;
                --fondo: #0a0f0f;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: radial-gradient(circle, var(--secundario) 0%, var(--fondo) 100%);
                font-family: 'Lugrasimo', cursive;
                color: #fff;
            }

            .container {
                animation: fadeIn 0.8s ease-out;
                background: linear-gradient(145deg, rgba(28, 55, 56, 0.9), rgba(10, 15, 15, 0.95));
                padding: 60px;
                border-radius: 15px;
                border: 2px solid var(--primario);
                box-shadow: 0 0 0 10px var(--secundario), 0 30px 60px rgba(0,0,0,0.8);
                width: 100%;
                max-width: 420px;
                text-align: center;
                position: relative;
            }

            .container::before {
                content: '✦';
                position: absolute;
                top: 20px;
                left: 20px;
                color: var(--acento);
                font-size: 24px;
            }

            h2 {
                font-family: 'Felipa', serif;
                font-size: 45px;
                color: var(--acento);
                margin-bottom: 40px;
                text-shadow: 3px 3px 6px #000;
            }

            .form-group { margin-bottom: 25px; }

            input {
                width: 100%;
                padding: 15px;
                background: rgba(0,0,0,0.5);
                border: 1px solid var(--primario);
                border-left: 5px solid var(--acento);
                color: #fff;
                font-family: 'Lugrasimo', cursive;
                box-sizing: border-box;
                transition: 0.3s;
            }

            input:focus {
                outline: none;
                box-shadow: 0 0 15px var(--primario);
                background: rgba(56, 134, 89, 0.1);
            }

            .btn {
                width: 100%;
                padding: 18px;
                background: var(--primario);
                border: 2px solid var(--acento);
                color: #fff;
                font-family: 'Quintessential', cursive;
                font-size: 24px;
                cursor: pointer;
                transition: 0.4s;
                margin-top: 15px;
            }

            .btn:hover {
                background: var(--acento);
                color: var(--secundario);
                transform: scale(1.02);
            }

            .link {
                display: block;
                margin-top: 30px;
                color: var(--acento);
                text-decoration: none;
                font-size: 18px;
            }

            .link:hover { text-decoration: underline; }

            .error {
                background: var(--error);
                padding: 10px;
                margin-top: 20px;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Ingresar</h2>
            <form action="LoginServlet" method="POST">
                <div class="form-group">
                    <input type="email" name="correo" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <input type="password" name="contrasena" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn">Abrir Portal</button>
            </form>
            
            <% if(request.getAttribute("error") != null) { %>
                <div class="error"><%= request.getAttribute("error") %></div>
            <% } %>

            <a href="Registrar.jsp" class="link">¿No tienes cuenta? Regístrate</a>
        </div>
    </body>
</html>
